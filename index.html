<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alifior — Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* Arts Gala — plain, functional admin theme (no gradients / glow / motion-for-motion's-sake) */
:root{
--bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF0F3; --line:#DCE0E6;
--ink:#1B1F27; --dim:#5B6472;
--primary:#7F2F6F; --primary-ink:#FFFFFF;
--gold:#C97A12; --gold-bg:#FCEBD2;
--maroon:#8A2846; --green:#2E9A7C; --red:#D8402F;
--teal:#3BB292; --orange:#F29E22; --purple:#7F2F6F;
--text:var(--ink);
}
:root[data-theme="dark"]{
--bg:#242730; --surface:#2E313C; --surface2:#383C47; --line:#4A4E5A;
--ink:#EDEFF3; --dim:#A7ACB8;
--gold-bg:#3A2E12;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; transition:background .2s, color .2s;}
h1,h2,h3,.disp{font-family:'Sora',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:'Inter',sans-serif; cursor:pointer; border:none;}
input,select,textarea{
background:var(--surface); border:1px solid var(--line); color:var(--text);
border-radius:8px; padding:9px 12px; outline:none; font-family:'Inter',sans-serif; font-size:14px;
}
input::placeholder{color:var(--dim);}
input:focus, select:focus{border-color:var(--primary);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px;}
.btn-gold{background:var(--primary); color:var(--primary-ink); font-weight:600; padding:10px 18px; border-radius:8px; font-size:14px;}
.btn-ghost{background:var(--surface); color:var(--text); padding:9px 16px; border-radius:8px; font-size:14px; border:1px solid var(--line);}
.btn-danger{background:var(--red); color:#fff; padding:9px 16px; border-radius:8px; font-size:14px;}
.btn-green{background:var(--green); color:#fff; padding:9px 16px; border-radius:8px; font-size:14px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); padding:8px 10px;}
html,body{overflow-x:hidden;}
.table-scroll{
width:100%;
overflow-x:auto;
overflow-y:hidden;
-webkit-overflow-scrolling:touch;
scrollbar-width:auto;
}
.table-scroll table{
width:max-content;
min-width:100%;
}
.table-scroll th,.table-scroll td{
white-space:nowrap;
}

td{padding:8px 10px; font-size:14px; border-top:1px solid var(--line); color:var(--text);}
.navbar{
display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:14px;
position:sticky; top:0; z-index:30;
background:var(--surface);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex-shrink:1;}
.brand-mark{
width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800;
background:var(--surface2); color:#fff; overflow:hidden; flex-shrink:0;
}
.brand-mark img{width:100%; height:100%; object-fit:contain;}
.brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
.brand-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:17px; letter-spacing:.01em; color:var(--ink); white-space:nowrap; }
.brand-live{display:flex; align-items:center; gap:5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); white-space:nowrap;}
.live-dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0;}
.navlinks{display:flex; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:4px; flex-shrink:0;}
.navlink{padding:8px 16px; border-radius:7px; font-size:13.5px; font-weight:600; color:var(--dim); position:relative; transition:color .15s, background .15s; white-space:nowrap; flex-shrink:0;}
.navlink:hover{color:var(--text); background:var(--surface);}
.navlink.active{color:#fff; background:var(--primary);}
.cta-btn{
padding:9px 18px; border-radius:8px; font-size:13.5px; font-weight:600; color:#fff;
background:var(--primary); border:1px solid var(--primary);
display:flex; align-items:center; gap:6px; white-space:nowrap; flex-shrink:0;
}
@media(max-width:760px){
.navbar{padding:10px 12px; gap:8px;}
.brand{gap:6px;}
.brand-mark{width:28px; height:28px; border-radius:7px;}
.brand-live{display:none;}
.brand-title{font-size:13px; overflow:hidden;}
.brand-title img{height:22px !important; width:auto;}
.cta-btn{flex-shrink:0; padding:7px 10px; font-size:11.5px;}
.navlinks{flex:1 1 auto; min-width:0; overflow-x:auto; justify-content:flex-start; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:2px; padding:3px;}
.navlinks::-webkit-scrollbar{display:none;}
.navlink{padding:6px 10px; font-size:11.5px;}
}
@media(max-width:400px){
.brand-title img{height:19px !important;}
.navlink{padding:6px 8px; font-size:11px;}
.cta-btn{padding:6px 8px; font-size:11px;}
}
.hero{position:relative; padding:78px 28px 64px; text-align:center; overflow:hidden;
background:#181510 linear-gradient(135deg,#221b12,#100e0b); background-size:cover; background-position:center;}
.hero-overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,10,8,.35) 0%, rgba(10,9,7,.88) 100%);}
.hero-content{position:relative; z-index:2; max-width:640px; margin:0 auto;}
.hero-logo{width:74px; height:74px; object-fit:contain; margin:0 auto 16px; display:block; filter:drop-shadow(0 4px 14px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(0,0,0,.45));}
.hero-wordmark{filter:drop-shadow(0 3px 10px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(0,0,0,.5)); background:rgba(0,0,0,.22); padding:10px 18px; border-radius:12px; backdrop-filter:blur(2px);}
.hero-edition{display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#F5B45C;
background:rgba(242,158,34,.16); border:1px solid rgba(242,158,34,.45); padding:6px 14px; border-radius:20px; margin-bottom:18px; font-weight:700;}
.hero-title{font-family:'Sora',sans-serif; font-weight:800; font-size:42px; line-height:1.1; margin:0 0 16px; color:#fff;}
.hero-sub{color:#D8D3C8; max-width:520px; margin:0 auto 22px; font-size:14.5px;}
.hero-meta{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:26px;}
.hero-pill{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600; color:#F2F0EA; backdrop-filter:blur(2px);}
.hero-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.hero-btn-primary{background:#E8443A; color:#fff; padding:13px 24px; border-radius:9px; font-weight:700; font-size:14px;
display:inline-flex; align-items:center; gap:8px; text-decoration:none; border:1px solid #E8443A;}
.hero-btn-ghost{background:transparent; color:#fff; padding:13px 24px; border-radius:9px; font-weight:700; font-size:14px;
border:1px solid rgba(255,255,255,.4); text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
@media(max-width:640px){ .hero-title{font-size:30px;} }
.eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; font-weight:600;}
/* ---- team points (white theme) ---- */
.points-wrap{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.05);}
.points-eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:6px;}
.points-title{font-family:'Sora',sans-serif; font-weight:800; font-size:26px; margin:0 0 22px; color:var(--ink);}
.podium-grid{display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:14px; align-items:end; margin-bottom:26px;}
.podium-card{background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:20px 14px; text-align:center;}
.podium-card.first{background:linear-gradient(180deg, rgba(154,107,20,.12), rgba(154,107,20,.02) 70%); border-color:var(--gold);
box-shadow:0 0 0 1px rgba(154,107,20,.18), 0 14px 32px rgba(154,107,20,.10); padding-top:26px;}
.podium-label{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:700; margin-bottom:10px;}
.podium-card.first .podium-label{color:var(--gold);}
.podium-num{font-family:'Sora',sans-serif; font-weight:800; font-size:28px; color:#9099A6; margin-bottom:10px;}
.podium-card.first .podium-num{font-size:42px; color:var(--gold);}
.podium-team{font-weight:700; font-size:14px; color:var(--ink); margin-bottom:6px;}
.podium-pts{font-family:'Sora',sans-serif; font-weight:800; font-size:18px; color:var(--dim);}
.podium-card.first .podium-pts{font-size:22px; color:var(--gold);}
@media(max-width:640px){ .podium-grid{grid-template-columns:1fr;} .podium-card.first{order:-1;} }
.points-search-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.points-count{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:700;}
.points-search-row input{background:var(--surface); border:1px solid var(--line); color:var(--ink); max-width:220px; flex:1;}
.points-note{font-size:11px; color:var(--dim); margin-bottom:14px;}
.points-list{border-top:1px solid var(--line);}
.points-row{display:flex; align-items:center; justify-content:space-between; padding:12px 6px; border-bottom:1px solid var(--line); gap:12px;}
.points-row .prank{width:26px; color:var(--dim); font-weight:700; font-size:13px; flex-shrink:0;}
.points-row .pname{flex:1; font-weight:600; font-size:14px; color:var(--ink);}
.points-row .ppts{font-family:'Sora',sans-serif; font-weight:700; color:var(--gold); font-size:13px; white-space:nowrap;}
/* ---- results page (dark accordion) ---- */
.results-dark{background:var(--bg); min-height:100vh; padding-bottom:10px;}
.results-hero{max-width:1100px; margin:0 auto; padding:46px 24px 6px;}
.results-eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;}
.results-title{font-family:'Sora',sans-serif; font-weight:800; font-size:32px; color:var(--ink); margin:0 0 12px;}
.results-desc{color:var(--dim); font-size:14px; max-width:560px; margin-bottom:20px; line-height:1.5;}
.results-count{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:700; border-top:1px solid var(--line); padding-top:16px;}
.results-filters{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 22px;}
.results-filters input{flex:2; min-width:200px; background:var(--surface); border:1px solid var(--line); color:var(--ink);}
.results-filters select{flex:1; min-width:150px; background:var(--surface); border:1px solid var(--line); color:var(--ink);}
.result-acc{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04);}
.result-acc-head{display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;}
.result-num{width:36px; height:36px; border-radius:8px; border:1px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center;
font-weight:800; font-size:12px; flex-shrink:0; font-family:'Sora',sans-serif;}
.result-head-title{font-weight:700; color:var(--ink); font-size:15px;}
.result-head-sub{font-size:12px; color:var(--dim); margin-top:2px;}
.result-chevron{color:var(--dim); font-size:12px; margin-left:auto; flex-shrink:0;}
.result-acc-body{padding:2px 18px 18px; border-top:1px solid var(--line);}
.result-table{border-collapse:collapse; margin-top:10px;}
.result-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); padding:8px 6px;}
.result-table td{padding:9px 6px; font-size:13.5px; color:var(--ink); border-top:1px solid var(--line);}
.grade-pill{background:var(--primary); color:#fff; font-size:11px; padding:2px 8px; border-radius:5px;}
.result-actions{display:flex; gap:10px; margin-top:14px;}
.result-actions button{background:var(--surface2); color:var(--ink); border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600;}
.section{max-width:1100px; margin:0 auto; padding:44px 24px;}
.section h2{font-size:23px; font-weight:700; margin-bottom:20px; color:var(--ink);}
.poster{
position:relative; border-radius:14px; padding:26px; overflow:hidden;
background:#20242E; color:#F2F3F5;
border:1px solid #2E333F;
}
.poster .res-label{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#B7BCC6; margin-bottom:4px;}
.poster .res-num{font-family:'Sora',sans-serif; font-weight:800; font-size:30px; border:1px solid #454C5C; border-radius:8px; display:inline-block; padding:2px 14px; margin-bottom:12px;}
.poster .prog{font-family:'Sora',sans-serif; font-weight:700; font-size:18px; color:var(--gold); margin-bottom:2px;}
.poster .cat{font-size:12px; color:#B7BCC6; margin-bottom:14px;}
.rank-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #363B48;}
.rank-row:first-of-type{border-top:none;}
.medal{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}
.gallery-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
.gallery-grid img{width:100%; height:150px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:pointer;}
.lightbox{position:fixed; inset:0; background:rgba(10,10,14,0.9); display:flex; align-items:center; justify-content:center; z-index:100; padding:30px;}
.lightbox img{max-width:90%; max-height:85%; border-radius:10px;}
.sidebar{width:220px; flex-shrink:0; padding:18px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:6px; background:var(--surface);}
.tabbtn{text-align:left; padding:10px 12px; border-radius:8px; font-size:14px; color:var(--dim); background:transparent; border:1px solid transparent;}
.tabbtn.active{color:var(--primary); background:var(--surface2); border-color:var(--line); font-weight:600;}
.lock-banner{font-size:12px; padding:9px 12px; border-radius:8px; margin-bottom:12px; background:#FBEAEA; color:var(--red); border:1px solid #F1C7C7;}
.toast{position:fixed; bottom:20px; right:20px; padding:11px 18px; border-radius:10px; font-size:14px; color:#fff; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.18);}
.role-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px; display:flex; flex-direction:column; align-items:center; gap:8px; font-weight:600; color:var(--ink);}
.role-card:hover{border-color:var(--primary);}
.welcome-overlay{position:fixed; inset:0; z-index:150; background:rgba(8,8,12,.78); display:flex; align-items:center; justify-content:center; padding:20px;}
.welcome-box{position:relative; line-height:0;}
.welcome-box img{display:block; max-width:min(92vw,520px); max-height:88vh; width:auto; height:auto; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.welcome-close{position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; border:2px solid rgba(255,255,255,.85); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; z-index:2;}
@media(max-width:760px){ .shell{flex-direction:column;} .sidebar{width:100%; flex-direction:row; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--line);} }
</style>
</head>

function indexToLetter(i){
  let s=''; i++;
  while(i>0){ const rem=(i-1)%26; s=String.fromCharCode(65+rem)+s; i=Math.floor((i-1)/26); }
  return s;
}
function withAutoCodes(assignments, programId){
  const list = assignments.filter(a=>a.programId===programId);
  const codeMap = {};
  list.forEach((a,i)=>{ codeMap[a.id]=indexToLetter(i); });
  return assignments.map(a=> a.programId===programId ? {...a, code:codeMap[a.id]} : a);

async function syncPosterDocs(nextPosters){

const wanted=new Map((nextPosters||[]).filter(p=>p && p.id).map(p=>[p.id,p]));
const existing=await f.getDocs(POSTERS_COL);
const jobs=[];
existing.forEach(d=>{ if(!wanted.has(d.id)) jobs.push(f.deleteDoc(f.doc(POSTERS_COL,d.id))); });
wanted.forEach((p,id)=>jobs.push(f.setDoc(f.doc(POSTERS_COL,id),p)));
await Promise.all(jobs);
}

function compressImage(file, maxDim, quality){
return new Promise((resolve,reject)=>{
const reader = new FileReader();
reader.onerror = reject;
reader.onload = ()=>{
const img = new Image();
img.onerror = reject;
img.onload = ()=>{
const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
const c = document.createElement('canvas');
c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
ctx.drawImage(img,0,0,c.width,c.height);
resolve(c.toDataURL('image/jpeg', quality));
};
img.src = reader.result;
};
reader.readAsDataURL(file);
});
}
async function compressImageForFirestore(file, maxDim=1400, quality=0.78){
let dim=maxDim, q=quality, dataUrl=null;
for(let i=0;i<6;i++){
  dataUrl=await compressImage(file,dim,q);
  if(dataUrl.length < 700000) return dataUrl;
  if(q>0.5) q-=0.08; else dim=Math.max(700,Math.round(dim*0.82));
}
if(dataUrl.length >= 900000) throw new Error('Image is too large for Firestore');
return dataUrl;
}

/* ---------------- ranking / posters ---------------- */
const GRADE_ORDER = ['A+','A','B','C','No Grade'];
function pickConsensusGrade(judgeScores){
const counts = {};
judgeScores.forEach(js=>{ if(js.grade) counts[js.grade] = (counts[js.grade]||0) + 1; });
const entries = Object.entries(counts);
if(!entries.length) return null;
entries.sort((a,b)=> b[1]-a[1] || GRADE_ORDER.indexOf(a[0])-GRADE_ORDER.indexOf(b[0]));
return entries[0][0];
}
function computeRanking(programId){
const assigned = DATA.assignments.filter(a=>a.programId===programId && a.code);
const ja = DATA.judgeAssignments.find(j=>j.programId===programId) || {};
const requiredJudges = [ja.judge1, ja.judge2, ja.judge3].filter(Boolean).length || 3;
const rows = assigned.map(a=>{
const s = DATA.scores.filter(sc=>sc.programId===programId && sc.code===a.code);
const judgeScores = s.map(x=>({judge:x.judge, grade:x.grade||'', points:x.points ?? null}));
const complete = s.length >= requiredJudges;
const consensusGrade = pickConsensusGrade(judgeScores);
const pointsGiven = judgeScores.map(js=>js.points).filter(p=>p!==null && !isNaN(p));
const avgPoints = pointsGiven.length ? pointsGiven.reduce((a,b)=>a+b,0)/pointsGiven.length : null;
return { code:a.code, studentId:a.studentId, judgeScores, complete, consensusGrade, avgPoints, judgeCount:s.length, requiredJudges };
});
const ranked = rows.filter(r=>r.avgPoints!==null).sort((a,b)=>b.avgPoints-a.avgPoints);
ranked.forEach((r,i)=>{ r.rank=i+1; });
rows.forEach(r=>{ if(r.avgPoints===null) r.rank='—'; });
rows.forEach(r=>{
r.grade = r.consensusGrade || '—';
r.points = (r.complete && r.avgPoints!==null) ? Math.round(r.avgPoints*10)/10 : 0;
});
return rows.sort((a,b)=> (a.rank==='—'?1:b.rank==='—'?-1:a.rank-b.rank));
}
function confirmResult(programId){
const ranking = computeRanking(programId);
const prog = DATA.programs.find(p=>p.id===programId);
const cat = DATA.categories.find(c=>c.id===prog?.categoryId);
const winners = ranking.filter(r=> r.rank!=='—').map(r=>{
const s = DATA.students.find(x=>x.id===r.studentId);
return { rank:r.rank, name:s?.name, team:nameOf(DATA.teams, s?.teamId), grade:r.grade, points:r.points };
});
const nextResults = [...DATA.results.filter(r=>r.programId!==programId), { programId, ranking, confirmedAt: Date.now() }];
const existingDraft = (DATA.posterDrafts||[]).find(d=>d.programId===programId);
const existingPoster = DATA.posters.find(p=>p.programId===programId);
const draft = {
id: existingDraft?.id || uid('draft'),
programId, programName: prog?.name || 'Event', categoryName: cat?.name || '',
resultNumber: existingPoster?.resultNumber || null, createdAt: existingDraft?.createdAt || Date.now(), winners
};
const nextDrafts = [...(DATA.posterDrafts||[]).filter(d=>d.programId!==programId), draft];
saveData({ ...DATA, results: nextResults, posterDrafts: nextDrafts });
toast('Result confirmed — go to the Poster tab to upload the poster image');
}
function renumberPosters(posters){
const sorted = [...posters].sort((a,b)=> (a.resultNumber||0) - (b.resultNumber||0) || a.createdAt-b.createdAt);
return sorted.map((p,i)=>({...p, resultNumber:i+1}));
}
function revokeResult(programId){
const nextPosters = renumberPosters(DATA.posters.filter(p=>p.programId!==programId));
saveData({ ...DATA, results: DATA.results.filter(r=>r.programId!==programId),
posters: nextPosters,
posterDrafts: (DATA.posterDrafts||[]).filter(d=>d.programId!==programId) });

function computeStandingsFrom(results){
const totals = {};
results.forEach(r=>{
r.ranking.forEach(row=>{
if(!row.points) return;
const s = DATA.students.find(x=>x.id===row.studentId); if(!s) return;
totals[s.teamId] = (totals[s.teamId]||0) + row.points;
});
});
return Object.entries(totals).map(([teamId,pts])=>({teamId, pts, name:nameOf(DATA.teams,teamId)})).sort((a,b)=>b.pts-a.pts);
}

function submitScore(){

const gradeVal = document.getElementById('j_grade').value;
const pointsVal = document.getElementById('j_points').value;
if(!progId||!code) return toast('Pick a program and enter the code','err');
if(!DATA.assignments.some(a=>a.programId===progId && a.code===code)) return toast('Code not found for this program','err');

if(pointsVal==='' || isNaN(Number(pointsVal)) || Number(pointsVal)<0) return toast('Enter the points to award','err');
const filtered = DATA.scores.filter(s=>!(s.programId===progId && s.judge===JUDGE_NAME && s.code===code));

function toEmbedUrl(url){
try{
const u = new URL(url);
if(u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')){
let id = u.hostname.includes('youtu.be') ? u.pathname.slice(1) : u.searchParams.get('v');
if(!id && u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
return id ? `https://www.youtube.com/embed/${id}` : null;
}
if(u.hostname.includes('vimeo.com')){
const id = u.pathname.split('/').filter(Boolean)[0];
return id ? `https://player.vimeo.com/video/${id}` : null;
}
}catch(e){}
return null;
}

}
function importBackup(input){
const file = input.files[0]; if(!file) return;
const reader = new FileReader();
reader.onload = () => { try{ saveData(JSON.parse(reader.result)); toast('Backup restored'); } catch(e){ toast('Invalid backup file','err'); } };
reader.readAsText(file);
}
function renderAdminBackup(){
return section('Backup', `<div class="card">
<button class="btn-gold" onclick="exportBackup()" style="margin-bottom:16px;">⬇ Export Backup (.json)</button>
<div><label style="font-size:12px; color:var(--dim); display:block; margin-bottom:6px;">Import & Restore Data</label>
<input type="file" accept="application/json" onchange="importBackup(this)"/></div>
</div>`);
}
function renderAdmin(){
if(TAB==='setup') return renderAdminSetup();
if(TAB==='teammgr') return renderAdminTeamMgr();
if(TAB==='teamdata') return renderAdminTeamData();
if(TAB==='schedule') return renderAdminSchedule();
if(TAB==='approval') return renderAdminApproval();
if(TAB==='standings') return renderAdminStandings();
if(TAB==='poster') return renderAdminPoster();
if(TAB==='gallery') return renderAdminGallery();
if(TAB==='highlights') return renderAdminHighlights();
if(TAB==='welcome') return renderAdminWelcome();
if(TAB==='settings') return renderAdminSettings();
if(TAB==='backup') return renderAdminBackup();
return '';
}
/* ---------------- boot ---------------- */
loadAll();
</script>
